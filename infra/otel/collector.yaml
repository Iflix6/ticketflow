# Minimal OTel collector for the local `tracing`/`monitoring` profiles.
# Debug exporter by default; a/Jaeger and OTLP persistence are in the hardening backlog.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 2s

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
