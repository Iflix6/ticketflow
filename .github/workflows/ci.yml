name: ci

on:
  push:
    branches: [main]
  pull_request:

# Fresh-clone reproduction: install → build → typecheck → lint → unit → migrate → seed →
# integration (real PostgreSQL service container) → invariants → boot smoke → rollback smoke →
# the flagship 1,000-vs-100 experiment asserting no oversell. No step claims a result the runner did
# not actually produce; `verify` is the same chain, locally.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: ci_main
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci_main"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
      # OTLP collector for the tracing-enabled boot-smoke step. Its default config exposes an OTLP/HTTP
      # receiver on 4318; the app is defensive, so a slow/absent collector can never fail the build.
      otel:
        image: otel/opentelemetry-collector-contrib:0.115.0
        ports:
          - 4318:4318
    env:
      DATABASE_URL: postgresql://ci:ci_only_password@localhost:5432/ci_main
      REDIS_URL: redis://localhost:6379
      # Repo-level fallback is a CI-only value (NODE_ENV=ci, ephemeral containers). Configure the
      # repository secret to exercise the real-secret path; production startup refuses values like this.
      AUTH_SECRET: ${{ secrets.CI_AUTH_SECRET || 'ci_only_placeholder_secret_change_me_32chars' }}
      NODE_ENV: ci
      LOG_LEVEL: warn
      # Attribute every recorded experiment run to the exact commit under test. The experiments
      # service stores `config.GIT_SHA ?? null` on `experiment_runs.git_sha`; without this the column
      # is null and runs are not revision-comparable (a limitation explicitly recorded in the Phase 6
      # benchmark report — this line removes it for CI-driven runs).
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install (npm workspaces — the documented package manager choice, ADR-0008)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Migrations on a fresh database
        run: npm run migrate

      - name: Seed catalog + experiment fixture
        run: npm run seed -- --experiment

      - name: Integration tests (real PostgreSQL)
        # Per-suite shard databases are created from this connection; the CI role owns the server.
        run: npm run test:integration
        env:
          TF_TEST_DATABASE_URL: postgresql://ci:ci_only_password@localhost:5432/ci_main

      - name: Invariant views (quiescent)
        run: npm run invariants -- --quiescent

      # Boots the *compiled* artifact (`dist/server.js`) over real HTTP against the seeded service
      # database, then verifies graceful shutdown. This is the step that a stale build once masked,
      # so it must run after Build (artifact present) and after Seed (login fixtures exist).
      - name: Boot smoke (built artifact over HTTP)
        run: npm run boot:smoke
        env:
          LAB_ENABLED: 'true'

      # Proves the OpenTelemetry SDK path end to end on the SHIPPED artifact: the tracer provider registers
      # before pg/http/express load (see server.ts dynamic-import ordering), instrumentations activate, and
      # the process still boots, serves, and drains cleanly. Export failing against the collector must not
      # change the result — that resilience is exactly what this step guards.
      - name: Boot smoke with tracing enabled (OTel SDK -> collector)
        run: npm run boot:smoke
        env:
          LAB_ENABLED: 'true'
          OTEL_ENABLED: 'true'
          OTEL_EXPORTER_OTLP_ENDPOINT: 'http://localhost:4318'

      - name: Migration rollback smoke (down then up again)
        run: |
          npm run migrate:down -- 9
          npm run migrate

      # The Phase 7 gate, executed — not described. Boots the *compiled* artifact against the seeded
      # service database and drives the real reservation API over HTTP with 1,000 buyers vs the 100-seat
      # `lab-flagship-1000-vs-100` fixture. `npm run bench` exits non-zero ONLY on an actual oversell
      # (confirmed > start capacity); transient 5xx under runner CPU contention are the documented
      # fail-safe path (pool-acquisition timeout returns 500 rather than overselling) and must NOT turn
      # the gate red — so the assertion is the safety invariant, not throughput or a clean error count.
      - name: Flagship experiment (1,000 buyers vs 100 tickets) — no-oversell gate
        env:
          LAB_ENABLED: 'true'
          RATE_LIMIT_MAX: '100000'
          PORT: '4000'
          HOST: '127.0.0.1'
        run: |
          node apps/api/dist/server.js > /tmp/flagship-api.log 2>&1 &
          API_PID=$!
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4000/health/ready > /dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then echo "[ci] API never became ready"; cat /tmp/flagship-api.log; kill $API_PID; exit 1; fi
          set +e
          npm run bench -- --event-slug lab-flagship-1000-vs-100 --users 1000 --concurrency 100 --quantity 1 --outcome success --label ci-flagship
          bench_status=$?
          set -e
          kill $API_PID
          if [ "$bench_status" -ne 0 ]; then echo "[ci] bench exit=$bench_status"; tail -40 /tmp/flagship-api.log; fi
          exit $bench_status

      - name: Invariant views after the flagship burst (must still hold)
        run: npm run invariants -- --quiescent

      - name: Upload flagship artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flagship-experiment
          path: load-tests/results/ci-flagship-*
          if-no-files-found: warn

      # Dependency audit remains informational until the advisory baseline is triaged; a hard gate
      # on an untriaged feed produces red CI with no actionability (documented in the runbook).
      - name: Dependency audit (report only)
        continue-on-error: true
        run: npm audit --audit-level=high
